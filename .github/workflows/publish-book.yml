name: 수학 학습지 발행

on:
  push:
    branches:
      - claude/adult-math-learning-0F3mL
      - main
    paths:
      - "math-learning/**"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

# GitHub Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 한국어 폰트 설치 (Noto CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv

      - name: Quarto 설치
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.39"

      - name: HTML 빌드
        run: quarto render math-learning --to html
        env:
          QUARTO_PRINT_STACK: true

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: math-learning/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
